  :root{
    --bg:#0B0B0C; --panel:#161617; --line: rgba(255,255,255,0.09);
    --grey:#9A9A9E; --grey-dim:#6C6C70; --white:#EDEDEE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--white);
    font-family:-apple-system,'Segoe UI',Inter,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:32px 16px;
  }
  h1{font-size:19px;font-weight:700;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--grey);margin-bottom:22px;text-align:center;max-width:420px;}
  .viewer-wrap{
    width:100%;max-width:900px;aspect-ratio:16/10;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);position:relative;background:#000;
  }
  #panorama{width:100%;height:100%;}
  .hint{margin-top:16px;font-size:12px;color:var(--grey-dim);letter-spacing:.03em;text-align:center;}
  .badge{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;color:var(--grey-dim);
    border:1px solid var(--line);padding:5px 12px;border-radius:100px;margin-bottom:14px;
  }
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#4CAF66;}
</style>
